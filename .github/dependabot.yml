version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/src/Scrobblix.Application"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 10
