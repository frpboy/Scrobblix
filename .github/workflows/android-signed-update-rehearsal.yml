name: Candidate-only narrow About qualification (registered path)
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Exact independently reviewed full candidate commit SHA; required'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: scrobblix-about-boundary-once-20261108
  cancel-in-progress: false
jobs:
  android-about-runtime:
    if: github.repository == 'frpboy/Scrobblix' && github.event.repository.private == false && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require exact reviewed commit, first attempt and narrow event
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: python3 scripts/guard-about-qualification.py
      - name: About only, synthetic external handler, emulator egress blocked
        shell: bash
        env:
          ABOUT_API: ${{ matrix.api }}
        run: bash scripts/qualify-about-android.sh
      - name: Emit bounded synthetic screenshot diagnostic records (no artifact storage)
        run: python3 scripts/about-pixel-log.py encode android-about-evidence
