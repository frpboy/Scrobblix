name: Android launcher icon qualification
on:
  pull_request:
    branches: [main]
    paths: ['android/app/src/main/res/**', 'android/app/src/main/AndroidManifest.xml', 'android/app/src/androidTest/**', '.github/workflows/android-launcher-icon.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-launcher-icon-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  launcher-icon-pixels:
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile installable preview app and its instrumentation
        shell: bash
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          android/gradlew -p android :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - name: Android API${{ matrix.api }} emulator launcher icon qualification
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          export ANDROID_USER_HOME="$RUNNER_TEMP/scrobblix-android"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          sdkmanager 'emulator' 'system-images;android-${{ matrix.api }};default;x86_64'
          echo no | avdmanager create avd -n scrobblix-test -k 'system-images;android-${{ matrix.api }};default;x86_64' --path "$ANDROID_AVD_HOME/scrobblix-test.avd" --force
          emulator -list-avds | grep -Fx scrobblix-test
          emulator -avd scrobblix-test -no-window -no-audio -no-snapshot -gpu swiftshader_indirect -no-boot-anim > /tmp/scrobblix-emulator.log 2>&1 &
          emulator_pid=$!
          cleanup_emulator() {
            status=$?
            set +e
            if [ "$status" -ne 0 ]; then
              timeout 10 adb devices -l
              tail -80 /tmp/scrobblix-emulator.log
            fi
            kill "$emulator_pid"
            exit "$status"
          }
          trap cleanup_emulator EXIT
          if ! timeout 180 adb wait-for-device; then
            cat /tmp/scrobblix-emulator.log
            exit 1
          fi
          booted=false
          for attempt in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then booted=true; break; fi
            sleep 2
          done
          if [ "$booted" != true ]; then tail -80 /tmp/scrobblix-emulator.log; exit 1; fi
          adb root
          adb wait-for-device
          test "$(timeout 15 adb shell id -u | tr -d '\r')" = 0
          # No fixture work runs in this job; keep emulator egress blocked anyway.
          adb shell iptables -w 30 -I OUTPUT 1 ! -o lo -j REJECT
          adb shell ip6tables -w 30 -I OUTPUT 1 ! -o lo -j REJECT
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb install -r android/app/build/outputs/apk/debug/app-debug.apk
          adb install -r android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb shell pm list instrumentation | grep -F 'com.frpboy.scrobblix.test/androidx.test.runner.AndroidJUnitRunner'
          # Packaged icon layers resolved through PackageManager and rendered on-device.
          result=$(adb shell am instrument -w -r -e class 'dev.scrobblix.app.LauncherIconQualificationTest' com.frpboy.scrobblix.test/androidx.test.runner.AndroidJUnitRunner)
          printf '%s\n' "$result"
          printf '%s\n' "$result" | grep -F 'OK (1 test)'
          if printf '%s\n' "$result" | grep -E 'FAILURES|INSTRUMENTATION_FAILED|Process crashed'; then exit 1; fi
          mkdir -p android-icon-evidence
          adb pull /sdcard/Android/data/com.frpboy.scrobblix/files/scrobblix-launcher-icon-composed.png android-icon-evidence/
          if adb shell ls /sdcard/Android/data/com.frpboy.scrobblix/files/scrobblix-launcher-icon-monochrome-tinted.png > /dev/null 2>&1; then
            adb pull /sdcard/Android/data/com.frpboy.scrobblix/files/scrobblix-launcher-icon-monochrome-tinted.png android-icon-evidence/
          fi
          # Real launcher pixels: home surface and app drawer, light and dark.
          size=$(adb shell wm size | tr -d '\r' | sed 's/.*: //')
          w=${size%x*}; h=${size#*x}; cx=$((w/2)); from=$((h*4/5)); to=$((h/5))
          launcher_capture() {
            adb shell input keyevent KEYCODE_HOME
            sleep 3
            adb shell screencap -p "/sdcard/Download/scrobblix-launcher-home-$1.png"
            adb shell input swipe "$cx" "$from" "$cx" "$to" 400
            sleep 3
            adb shell screencap -p "/sdcard/Download/scrobblix-launcher-drawer-$1.png"
            adb shell input keyevent KEYCODE_HOME
            sleep 1
          }
          launcher_capture light
          adb shell cmd uimode night yes
          sleep 2
          launcher_capture dark
          adb shell cmd uimode night auto
          for name in launcher-home-light launcher-drawer-light launcher-home-dark launcher-drawer-dark; do
            adb pull "/sdcard/Download/scrobblix-$name.png" android-icon-evidence/
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          if-no-files-found: error
          name: android-launcher-icon-evidence-api${{ matrix.api }}
          path: android-icon-evidence
