name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: browser-extension/package-lock.json
      - run: dotnet restore Scrobblix.slnx
      - run: dotnet build Scrobblix.slnx --no-restore --configuration Release
      - run: dotnet run --project tests/Scrobblix.Domain.Tests/Scrobblix.Domain.Tests.csproj --configuration Release --no-build
      - run: npm ci
        working-directory: browser-extension
      - run: npm run check
        working-directory: browser-extension
      - run: npm run build
        working-directory: browser-extension
