name: CI

on:
  push:
    branches: [main, feat/private-beta-readiness]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: browser-extension/package-lock.json

      - name: Restore .NET solution
        run: dotnet restore Scrobblix.slnx

      - name: Build .NET solution
        run: dotnet build Scrobblix.slnx --no-restore --configuration Release

      - name: Dump WinUI XAML compiler diagnostics on build failure
        if: failure()
        shell: pwsh
        run: |
          $searchRoot = 'src/Scrobblix.Desktop/obj/Release'
          if (Test-Path $searchRoot) {
            $files = Get-ChildItem -Path $searchRoot -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -in @('input.json', 'output.json', 'XamlCompiler.log', 'XamlCompiler.err') }
            foreach ($file in $files) {
              Write-Output "----- $($file.Name) ($($file.Length) bytes) -----"
              if ($file.Name -eq 'input.json') {
                Write-Output "XAML compiler input found: $($file.FullName)"
                continue
              }

              $raw = Get-Content -LiteralPath $file.FullName -Raw -ErrorAction SilentlyContinue
              if ($raw) {
                foreach ($needle in @('error', 'exception', 'lineNumber', 'XamlParseException', 'Message', 'diagnostic')) {
                  $index = $raw.IndexOf($needle, [StringComparison]::OrdinalIgnoreCase)
                  if ($index -ge 0) {
                    $startAt = [Math]::Max(0, $index - 240)
                    $length = [Math]::Min(1200, $raw.Length - $startAt)
                    Write-Output ("MATCH [{0}] {1}" -f $needle, $raw.Substring($startAt, $length))
                  }
                }
              }
            }

            $compiler = Get-ChildItem -Path "$env:USERPROFILE\.nuget\packages\microsoft.windowsappsdk.winui" -Recurse -Filter 'XamlCompiler.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
            $inputFile = Get-ChildItem -Path $searchRoot -Recurse -Filter 'input.json' -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($null -ne $compiler -and $null -ne $inputFile) {
              $replay = Join-Path $inputFile.DirectoryName 'output-diagnostic-replay.json'
              $stdout = Join-Path $inputFile.DirectoryName 'xaml-compiler-stdout.txt'
              $stderr = Join-Path $inputFile.DirectoryName 'xaml-compiler-stderr.txt'
              Write-Output "Replaying compiler with redirected stdout/stderr."
              $process = Start-Process -FilePath $compiler.FullName -ArgumentList @($inputFile.FullName, $replay) -Wait -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
              Write-Output "Replay exit code: $($process.ExitCode)"
              foreach ($logPath in @($stdout, $stderr)) {
                if (Test-Path $logPath) {
                  $text = Get-Content -LiteralPath $logPath -Raw -ErrorAction SilentlyContinue
                  if ($text) {
                    Write-Output "----- $([System.IO.Path]::GetFileName($logPath)) -----"
                    Write-Output $text.Substring(0, [Math]::Min(8000, $text.Length))
                  }
                }
              }
              if (Test-Path $replay) {
                $raw = Get-Content -LiteralPath $replay -Raw -ErrorAction SilentlyContinue
                if ($raw) {
                  foreach ($needle in @('error', 'exception', 'lineNumber', 'XamlParseException', 'Message', 'diagnostic')) {
                    $index = $raw.IndexOf($needle, [StringComparison]::OrdinalIgnoreCase)
                    if ($index -ge 0) {
                      $startAt = [Math]::Max(0, $index - 240)
                      $length = [Math]::Min(1600, $raw.Length - $startAt)
                      Write-Output ("REPLAY MATCH [{0}] {1}" -f $needle, $raw.Substring($startAt, $length))
                    }
                  }
                }
              }
            }
          }
          exit 0
      - name: Validate desktop UI contracts
        run: node scripts/test-desktop-ui-contracts.mjs

      - name: Run domain and infrastructure assertions
        run: dotnet run --project tests/Scrobblix.Domain.Tests/Scrobblix.Domain.Tests.csproj --configuration Release --no-build

      - name: Install browser companion dependencies
        run: npm ci
        working-directory: browser-extension

      - name: Type-check browser companion
        run: npm run check
        working-directory: browser-extension

      - name: Build browser companion
        run: npm run build
        working-directory: browser-extension

      - name: Test browser sender and payload validation
        run: node scripts/test-browser-security.mjs

      - name: Validate Chromium and Firefox manifests
        run: node scripts/validate-browser-manifests.mjs

      - name: Publish unpackaged Windows application
        run: dotnet publish src/Scrobblix.Desktop/Scrobblix.Desktop.csproj --configuration Release --no-restore --output artifacts/Scrobblix/desktop

      - name: Publish native messaging host
        run: dotnet publish src/Scrobblix.NativeHost/Scrobblix.NativeHost.csproj --configuration Release --no-restore --output artifacts/Scrobblix/native-host

      - name: Assemble local test bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = 'artifacts/Scrobblix'
          New-Item -ItemType Directory -Force -Path "$bundle/browser-extension" | Out-Null
          New-Item -ItemType Directory -Force -Path "$bundle/browser-extension-firefox" | Out-Null
          New-Item -ItemType Directory -Force -Path "$bundle/scripts" | Out-Null
          Copy-Item -Path 'browser-extension/manifest.json' -Destination "$bundle/browser-extension/manifest.json" -Force
          Copy-Item -Path 'browser-extension/manifest.firefox.json' -Destination "$bundle/browser-extension-firefox/manifest.json" -Force
          Copy-Item -Path 'browser-extension/dist/*' -Destination "$bundle/browser-extension-firefox/" -Recurse -Force
          Copy-Item -Path 'browser-extension/README.md' -Destination "$bundle/browser-extension/README.md" -Force
          Copy-Item -Path 'browser-extension/README.md' -Destination "$bundle/browser-extension-firefox/README.md" -Force
          Copy-Item -Path 'browser-extension/package.json' -Destination "$bundle/browser-extension/package.json" -Force
          Copy-Item -Path 'browser-extension/dist/*' -Destination "$bundle/browser-extension/" -Recurse -Force
          Copy-Item -Path 'scripts/install-native-host.ps1' -Destination "$bundle/scripts/" -Force
          Copy-Item -Path 'scripts/uninstall-native-host.ps1' -Destination "$bundle/scripts/" -Force
          Copy-Item -Path 'scripts/install-native-host.ps1' -Destination "$bundle/scripts/" -Force
          Copy-Item -Path 'docs/OWNER_SETUP_GUIDE.md' -Destination "$bundle/OWNER_SETUP_GUIDE.md" -Force
          @(
            'Scrobblix Windows development test bundle'
            ''
            '1. Install the Microsoft Windows App Runtime version required by this build.'
            '2. Launch Scrobblix.Desktop.exe from the desktop folder. The app is unpackaged and may require runtime prerequisites on a clean PC.'
            '3. Chromium: load browser-extension unpacked and register its ID with scripts/install-native-host.ps1 -ExtensionId <ID> -NativeHostPublishDirectory .\native-host. Firefox: load browser-extension-firefox as a temporary add-on, then register with -RegisterFirefox -NativeHostPublishDirectory .\native-host. The companion is optional for GSMTC playback.'
            '4. Do not place Last.fm secrets in this bundle or in Git. Configure them from the app Settings page.'
            '5. This is a CI verification bundle, not a signed installer or production release.'
          ) | Set-Content -Path "$bundle/README-TESTING.txt" -Encoding utf8
          Compress-Archive -Path "$bundle/*" -DestinationPath 'artifacts/Scrobblix-Windows-TestBundle.zip' -Force

      - name: Upload Windows test bundle
        uses: actions/upload-artifact@v4
        with:
          name: Scrobblix-Windows-TestBundle
          path: artifacts/Scrobblix-Windows-TestBundle.zip
          if-no-files-found: error
          retention-days: 14
