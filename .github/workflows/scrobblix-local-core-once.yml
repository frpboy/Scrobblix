name: Reviewed existing Windows package local-core EOL qualification
on:
  push:
    branches: [qa/local-core-eol-reviewed-20261109]
permissions:
  contents: read
  actions: read
concurrency:
  group: scrobblix-local-core-eol-20261109
  cancel-in-progress: false
jobs:
  ordinary-local-core:
    if: >-
      github.repository == 'frpboy/Scrobblix' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/qa/local-core-eol-reviewed-20261109' &&
      github.run_attempt == 1
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Guard unchanged production source and reviewed closure
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python qa/local-core/closure.py verify
          test "$(gh api repos/frpboy/Scrobblix/commits/main --jq .sha)" = 67422ae7bba6b7e3a38de5bcc0a395b6151db5d5
          git diff --exit-code 67422ae7bba6b7e3a38de5bcc0a395b6151db5d5 HEAD -- . \
            ':(exclude)qa/local-core/**' ':(exclude).github/workflows/scrobblix-local-core-once.yml'
          python qa/local-core/test_read_state.py
      - name: Retrieve exact already successful artifact, no product rebuild
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/frpboy/Scrobblix/actions/runs/42523442072 > "$RUNNER_TEMP/source-run.json"
          gh api repos/frpboy/Scrobblix/actions/artifacts/13633913382 > "$RUNNER_TEMP/source-artifact.json"
          python qa/local-core/check-source.py "$RUNNER_TEMP/source-run.json" "$RUNNER_TEMP/source-artifact.json"
          # curl strips Authorization on cross-host redirects. Never use --location-trusted.
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/frpboy/Scrobblix/actions/artifacts/13633913382/zip \
            --output "$RUNNER_TEMP/windows-artifact.zip"
          python qa/local-core/unpack-artifact.py "$RUNNER_TEMP/windows-artifact.zip" "$RUNNER_TEMP/Scrobblix-Windows-TestBundle.zip"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Build independent synthetic media driver only
        shell: pwsh
        run: dotnet publish qa/local-core/driver/Driver.csproj -c Release --self-contained false --output "$env:RUNNER_TEMP/local-core-driver"
      - name: Ordinary delivered process observes native playback and persists local eligibility
        shell: pwsh
        run: ./qa/local-core/run.ps1 -PackageZip "$env:RUNNER_TEMP/Scrobblix-Windows-TestBundle.zip" -DriverExe "$env:RUNNER_TEMP/local-core-driver/Driver.exe"
      - name: Whitelist synthetic evidence only
        if: always()
        shell: bash
        run: python qa/local-core/evidence.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ordinary-local-core-synthetic-evidence
          path: ${{ runner.temp }}/local-core-public-evidence/
          retention-days: 1
          if-no-files-found: error
