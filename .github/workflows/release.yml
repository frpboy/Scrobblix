name: Preview Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - name: Enforce semantic version tag format
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+)(\.[0-9A-Za-z-]+)*)?(\+([0-9A-Za-z-]+)(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Invalid release tag '$RELEASE_TAG'. Use vMAJOR.MINOR.PATCH, for example v0.1.0-beta.1."
            exit 1
          fi

  validate-and-package:
    name: Full Windows CI and package
    needs: validate-tag
    uses: ./.github/workflows/ci.yml
    with:
      concurrency_key: ${{ github.run_id }}-validate-and-package
    permissions:
      contents: read

  publish-preview:
    name: Publish GitHub preview release
    runs-on: ubuntu-latest
    needs: validate-and-package
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download validated Windows test bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Scrobblix-Windows-TestBundle
          path: artifacts/windows

      - name: Download validated browser companion
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Scrobblix-BrowserCompanion
          path: artifacts/browser

      - name: Prepare release assets and SHA-256 checksums
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          test -s artifacts/windows/Scrobblix-Windows-TestBundle.zip
          test -s artifacts/browser/Scrobblix-BrowserCompanion.zip
          cp artifacts/windows/Scrobblix-Windows-TestBundle.zip "release-assets/Scrobblix-Windows-TestBundle-${RELEASE_TAG}.zip"
          cp artifacts/browser/Scrobblix-BrowserCompanion.zip "release-assets/Scrobblix-BrowserCompanion-${RELEASE_TAG}.zip"
          (
            cd release-assets
            sha256sum ./*.zip > SHA256SUMS.txt
          )
          echo "Prepared release assets:"
          ls -lh release-assets
          cat release-assets/SHA256SUMS.txt

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name == 'v0.1.0-beta.5' && 'Scrobblix v0.1.0-beta.5 - Local storage compatibility (unsigned preview)' || github.ref_name == 'v0.1.0-beta.4' && 'Scrobblix v0.1.0-beta.4 - Windows x64 startup fix (unsigned preview)' || format('Scrobblix {0} - Preview', github.ref_name) }}
          prerelease: true
          make_latest: "false"
          generate_release_notes: ${{ github.ref_name != 'v0.1.0-beta.4' && github.ref_name != 'v0.1.0-beta.5' }}
          body_path: ${{ github.ref_name == 'v0.1.0-beta.5' && 'docs/releases/v0.1.0-beta.5.md' || github.ref_name == 'v0.1.0-beta.4' && 'docs/releases/v0.1.0-beta.4.md' || 'docs/releases/preview-default.md' }}
          files: release-assets/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
