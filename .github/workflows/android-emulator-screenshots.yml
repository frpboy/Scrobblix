name: Android emulator screenshots

on:
  workflow_dispatch:
    inputs:
      api-level:
        description: 'Android API level for the emulator'
        required: true
        default: '36'

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator, install app, capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ github.event.inputs.api-level || '36' }}
          arch: x86_64
          target: default
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            ./android/gradlew -p android :app:connectedDebugAndroidTest --stacktrace
            bash android/qa/pull-synthetic-frames.sh
            bash android/qa/capture-emulator-screenshots.sh

      - name: Verify connected tests actually ran
        if: always()
        run: |
          python3 - <<'PYEOF'
          import glob, sys, xml.etree.ElementTree as ET
          files = glob.glob('android/app/build/outputs/androidTest-results/connected/**/*.xml', recursive=True)
          tests = failures = errors = skipped = 0
          for f in files:
              r = ET.parse(f).getroot()
              tests += int(r.get('tests', 0)); failures += int(r.get('failures', 0))
              errors += int(r.get('errors', 0)); skipped += int(r.get('skipped', 0))
          print(f'suites={len(files)} tests={tests} failures={failures} errors={errors} skipped={skipped}')
          if tests == 0:
              print('ERROR: connected run executed zero tests')
              sys.exit(1)
          if failures or errors:
              print('ERROR: test failures present')
              sys.exit(2)
          PYEOF

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connected-test-reports
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/connected/
          retention-days: 14

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshots
          path: shots/
          retention-days: 14
