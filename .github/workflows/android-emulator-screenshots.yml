name: Android emulator screenshots

on:
  workflow_dispatch:
  push:
    branches:
      - ci/android-emulator-screenshots

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator, install app, capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: default
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            mkdir -p shots
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell input keyevent KEYCODE_HOME
            sleep 2
            adb exec-out screencap -p > shots/01-home.png
            # App drawer (swipe up from bottom of home screen)
            adb shell input swipe 540 1900 540 600 400
            sleep 2
            adb exec-out screencap -p > shots/02-app-drawer.png
            adb shell input keyevent KEYCODE_HOME
            sleep 1
            # Launch the app
            adb shell monkey -p com.frpboy.scrobblix -c android.intent.category.LAUNCHER 1
            sleep 12
            adb exec-out screencap -p > shots/03-app-main.png
            sleep 8
            adb exec-out screencap -p > shots/04-app-main-settled.png
            ls -la shots

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshots
          path: shots/
          retention-days: 14
