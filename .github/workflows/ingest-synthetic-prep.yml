name: DISPOSABLE ingest synthetic prep
# Test-only lane for the held isolated synthetic ingest test. Never runs on
# push/PR. The DSN arrives as a dispatch input (public write-only ingest id),
# is baked into DEBUG test artifacts only, and is persisted nowhere: no repo
# variable, no secret, no committed value. Artifacts upload with 1-day
# retention and are never a release.
#
# STAGE A (default; send_remote=false, also every push-triggered run) runs
# exactly two jobs (android-debug-apk, windows-debug-build): builds the
# DSN-baked candidate artifacts and proves them WITHOUT any remote event:
# emulator egress blocked (iptables), the Windows dump process firewalled to
# loopback, both wire dumps loopback-only. The DSN is supplied to EVERY build
# that compiles Scrobblix.Windows (Desktop and WireDump), and stage A reads
# the baked value back from the EXACT WireDump output assembly without
# initializing anything (--read-dsn-sha), from the Android generated
# BuildConfig source, and from the compiled APK dex bytes. The DSN-baked
# desktop executable is built, hashed and uploaded but never run; on Android
# the app cannot egress before the iptables guard is installed. Only an
# explicit zero-byte .gitkeep sentinel is excluded from the manifests (listed
# in the log); any other zero-byte file fails the run.
#
# STAGE B (send_remote=true + clearance-pinned inputs, manual dispatch only,
# after reviewer artifact clearance and project-owner readiness) runs exactly
# three jobs: a shared NO-EFFECT preflight, then one send job per platform
# that needs it. The preflight validates the qualified run's provenance
# (numeric run id, exact head sha, workflow path, workflow_dispatch event,
# success, and a job-set attestation that the qualified run contained ONLY
# the two no-send stage-A jobs), both pinned artifact ids, both pinned
# archive sha256 digests, and runs the committed verifier scripts
# (tests/artifact-verify/) against both extracted archives: literal
# root-relative paths only, traversal/rooted/duplicate paths rejected, every
# hashed file present at its exact path with matching bytes, every file in
# the tree manifest-listed or an explicit known aux/sentinel. Only after that
# preflight succeeds may a send job run; each send job re-downloads its
# pinned artifact, re-verifies the pinned archive digest (the deep checks
# bind to those exact bytes), and sends exactly ONE synthetic event from the
# verified path through the unchanged production boundary, after asserting
# the baked DSN sha256/host/project against the pinned expectations BEFORE
# any init/capture with the transport budget capped at 1 (Android boots
# disarmed at cap 0 on this branch and proves a pre-arming capture cannot
# send). No retry anywhere - a miss is a finding. Tees the FINAL wire
# UUID+timestamp (labelled HTTP exchange, not a stored receipt) for the
# project owner's exact lookup. Stage B must run within the stage-A artifact
# retention (1 day).
on:
  workflow_dispatch:
    inputs:
      dsn:
        description: 'Stage A: public Sentry ingest DSN for this disposable test build only'
        type: string
        required: false
        default: ''
      send_remote:
        description: 'STAGE B (GATED): send from qualified artifacts (requires artifact clearance + project owner ready)'
        type: boolean
        required: false
        default: false
      qualified_run_id:
        description: 'Stage B: numeric run id of the qualified no-send stage-A build'
        type: string
        required: false
        default: ''
      expected_source_head:
        description: 'Stage B: full commit sha the qualified run must have built'
        type: string
        required: false
        default: ''
      expected_android_artifact_id:
        description: 'Stage B: pinned numeric artifact id of the qualified android archive'
        type: string
        required: false
        default: ''
      expected_windows_artifact_id:
        description: 'Stage B: pinned numeric artifact id of the qualified windows archive'
        type: string
        required: false
        default: ''
      expected_android_zip_sha256:
        description: 'Stage B: pinned sha256 of the qualified android artifact zip'
        type: string
        required: false
        default: ''
      expected_windows_zip_sha256:
        description: 'Stage B: pinned sha256 of the qualified windows artifact zip'
        type: string
        required: false
        default: ''
      expected_dsn_sha256:
        description: 'Stage B: pinned sha256 of the baked DSN (asserted before init/send)'
        type: string
        required: false
        default: ''
      expected_endpoint_host:
        description: 'Stage B: pinned ingest endpoint host (asserted before init/send)'
        type: string
        required: false
        default: ''
      expected_project_id:
        description: 'Stage B: pinned ingest project id (asserted before init/send)'
        type: string
        required: false
        default: ''
      expected_execution_head:
        description: 'Stage B: reviewed head sha this send dispatch itself must run at'
        type: string
        required: false
        default: ''
  push:
    branches: [test/ingest-synthetic-prep-20261116]
permissions:
  contents: read
  actions: read  # stage B downloads the qualified stage-A artifacts via the API
concurrency:
  group: ingest-synthetic-prep-${{ github.run_id }}
jobs:
  android-debug-apk:
    if: ${{ !inputs.send_remote }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: STAGE A - build debug APKs with ephemeral DSN
        shell: bash
        env:
          SCROBBLIX_SENTRY_DSN: ${{ inputs.dsn }}
        run: |
          set -euo pipefail
          if [ -n "$SCROBBLIX_SENTRY_DSN" ]; then echo "dsn-sha256: $(printf '%s' "$SCROBBLIX_SENTRY_DSN" | sha256sum | cut -d' ' -f1)"; else echo 'no DSN supplied: local-only bake (loopback dump unaffected)'; fi
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          android/gradlew -p android :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
          # No-init config readback 1: the baked value as generated into the
          # app's BuildConfig source, compared against the dispatch value.
          bc=$(find android/app/build/generated -name BuildConfig.java -path '*dev/scrobblix/app*' | head -1)
          test -n "$bc" || { echo 'generated BuildConfig missing'; exit 1; }
          line=$(grep 'SCROBBLIX_SENTRY_DSN' "$bc")
          echo "android baked config readback (no init, generated source): $line"
          val=$(printf '%s' "$line" | sed -E 's/.*= "(.*)".*/\1/')
          if [ -n "$SCROBBLIX_SENTRY_DSN" ]; then
            [ "$val" = "$SCROBBLIX_SENTRY_DSN" ] || { echo 'MISMATCH: baked BuildConfig DSN differs from dispatch value'; exit 1; }
            echo "android baked config verified (generated source): sha256=$(printf '%s' "$val" | sha256sum | cut -d' ' -f1)"
          else
            [ -z "$val" ] || { echo 'unexpected DSN baked into BuildConfig'; exit 1; }
            echo 'android baked config empty as expected (generated source)'
          fi
          # No-init config readback 2: the ACTUAL compiled APK bytes - the
          # exact DSN literal must be present in the app apk's dex when a DSN
          # was dispatched (debug builds are unshrunk, ASCII literals intact).
          apk=$(ls android/app/build/outputs/apk/debug/*.apk)
          if [ -n "$SCROBBLIX_SENTRY_DSN" ]; then
            found=no
            for d in $(unzip -Z1 "$apk" | grep -E '^classes[0-9]*\.dex$'); do
              if unzip -p "$apk" "$d" | grep -aqF "$SCROBBLIX_SENTRY_DSN"; then found=yes; echo "exact DSN literal found in compiled APK dex: $d"; fi
            done
            [ "$found" = yes ] || { echo 'MISMATCH: dispatch DSN literal not present in compiled APK dex'; exit 1; }
          else
            if unzip -p "$apk" classes.dex | grep -aqF 'ingest.us.sentry.io'; then echo 'unexpected ingest endpoint literal in compiled APK dex'; exit 1; fi
            echo 'compiled APK dex carries no ingest endpoint literal, as expected'
          fi
      - name: STAGE A - hash artifacts and export merged manifest
        shell: bash
        run: |
          set -euo pipefail
          apk=$(ls android/app/build/outputs/apk/debug/*.apk)
          testapk=$(ls android/app/build/outputs/apk/androidTest/debug/*.apk)
          sha256sum "$apk" "$testapk" | tee android-artifact-sha256.txt
          manifest=$(find android/app/build/intermediates/merged_manifest -name 'AndroidManifest.xml' | head -1)
          cp "$manifest" merged-AndroidManifest.xml
          grep -n 'usesCleartextTraffic\|networkSecurityConfig' merged-AndroidManifest.xml || true
      - name: STAGE A - emulator loopback wire dump (egress blocked)
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          export ANDROID_USER_HOME="$RUNNER_TEMP/scrobblix-android"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          sdkmanager 'emulator' 'system-images;android-36;default;x86_64' >/dev/null
          echo no | avdmanager create avd -n scrobblix-dump -k 'system-images;android-36;default;x86_64' --path "$ANDROID_AVD_HOME/scrobblix-dump.avd" --force
          emulator -avd scrobblix-dump -no-window -no-audio -no-snapshot -gpu swiftshader_indirect -no-boot-anim > /tmp/scrobblix-dump-emulator.log 2>&1 &
          emulator_pid=$!
          cleanup_emulator() { kill "$emulator_pid" 2>/dev/null || true; }
          trap cleanup_emulator EXIT
          timeout 180 adb wait-for-device
          booted=false
          for attempt in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then booted=true; break; fi
            sleep 2
          done
          if [ "$booted" != true ]; then tail -80 /tmp/scrobblix-dump-emulator.log; exit 1; fi
          # No remote egress from the emulator: the dump is loopback-only, and
          # the baked app cannot reach any external path before this guard.
          # adb root races adbd startup on fresh boots ('unable to connect for
          # root: closed'); retry until adbd comes back as root.
          adb_root_ok=false
          for attempt in $(seq 1 10); do
            if adb root 2>&1 | grep -qE 'restarting adbd as root|already running as root'; then adb_root_ok=true; break; fi
            sleep 3
            adb wait-for-device || true
          done
          if [ "$adb_root_ok" != true ]; then echo 'adb root failed after retries'; tail -80 /tmp/scrobblix-dump-emulator.log; exit 1; fi
          adb wait-for-device
          booted=false
          for attempt in $(seq 1 60); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then booted=true; break; fi
            sleep 2
          done
          if [ "$booted" != true ]; then echo 'boot lost after adb root'; exit 1; fi
          adb shell iptables -w 30 -I OUTPUT 1 ! -o lo -j REJECT
          adb shell ip6tables -w 30 -I OUTPUT 1 ! -o lo -j REJECT
          adb install -r android/app/build/outputs/apk/debug/app-debug.apk >/dev/null
          adb install -r android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk >/dev/null
          result=$(adb shell am instrument -w -r -e class "dev.scrobblix.app.WireDumpTest" com.frpboy.scrobblix.test/androidx.test.runner.AndroidJUnitRunner)
          printf '%s\n' "$result"
          printf '%s\n' "$result" | grep -F 'OK (1 test)'
          adb shell run-as com.frpboy.scrobblix cat files/scrobblix-wiredump-android.txt > wiredump-android.txt
          test -s wiredump-android.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: error
          retention-days: 1
          name: ingest-prep-android-debug-DISPOSABLE
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/androidTest/debug/*.apk
            android-artifact-sha256.txt
            merged-AndroidManifest.xml
            wiredump-android.txt
  windows-debug-build:
    if: ${{ !inputs.send_remote }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: STAGE A - restore
        run: dotnet restore Scrobblix.slnx
      - name: STAGE A - build Desktop debug with ephemeral DSN
        shell: pwsh
        env:
          SCROBBLIX_SENTRY_DSN: ${{ inputs.dsn }}
        run: |
          if ($env:SCROBBLIX_SENTRY_DSN) {
            "dsn-sha256: " + [BitConverter]::ToString([Security.Cryptography.SHA256]::Create().ComputeHash([Text.Encoding]::UTF8.GetBytes($env:SCROBBLIX_SENTRY_DSN))).Replace('-','').ToLower()
          } else { 'no DSN supplied: local-only bake (in-memory dump unaffected)' }
          dotnet build src/Scrobblix.Desktop/Scrobblix.Desktop.csproj --configuration Debug --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Debug build failed' }
          $generated = Get-ChildItem -Recurse src/Scrobblix.Windows/obj -Filter ScrobblixSentryDsn.g.cs | Select-Object -First 1
          if (-not $generated) { throw 'Generated DSN source missing' }
          if ($env:SCROBBLIX_SENTRY_DSN) {
            if (-not (Select-String -Path $generated.FullName -Pattern '09034d8c28716f3d06cdd57fe02eb47d' -SimpleMatch -Quiet)) { throw 'DSN did not reach generated source' }
            'generated DSN source carries the dispatch value'
          } else {
            if ((Select-String -Path $generated.FullName -Pattern 'sentry.io' -Quiet)) { throw 'Unexpected DSN value baked into generated source' }
            'generated DSN source is empty as expected'
          }
      - name: STAGE A - loopback wire dump (process firewalled to loopback only)
        shell: pwsh
        env:
          SCROBBLIX_SENTRY_DSN: ${{ inputs.dsn }}
        run: |
          # The DSN env is supplied here too: this build compiles
          # Scrobblix.Windows via the WireDump ProjectReference, so the exe
          # stage B runs carries the SAME DSN epoch as the Desktop build.
          dotnet build tests/Scrobblix.WireDump/Scrobblix.WireDump.csproj --configuration Debug
          if ($LASTEXITCODE -ne 0) { throw 'WireDump build failed' }
          $exe = Get-ChildItem -Recurse tests/Scrobblix.WireDump/bin/Debug -Filter Scrobblix.WireDump.exe | Select-Object -First 1
          if (-not $exe) { throw 'WireDump exe missing' }
          "resolved dump executable: " + $exe.FullName
          # No-init readback of the baked const from the EXACT executing
          # assembly's referenced Scrobblix.Windows.dll (pure metadata read,
          # no SentrySdk.Init, no network), asserted against the dispatch DSN.
          '=== baked DSN readback from the exact executing assembly (no init) ==='
          if ($env:SCROBBLIX_SENTRY_DSN) {
            $expected = [BitConverter]::ToString([Security.Cryptography.SHA256]::Create().ComputeHash([Text.Encoding]::UTF8.GetBytes($env:SCROBBLIX_SENTRY_DSN))).Replace('-','').ToLower()
            & $exe.FullName --read-dsn-sha $expected
          } else {
            & $exe.FullName --read-dsn-sha
          }
          if ($LASTEXITCODE -ne 0) { throw 'Baked DSN readback failed or mismatched' }
          # Guard causality, phase 1 - BASELINE before any rule: the SAME exe
          # MUST reach the external endpoint. A failed baseline makes the whole
          # guard proof inconclusive, so the job stops here with that verdict.
          '=== guard phase 1: pre-rule baseline (expect external SUCCESS) ==='
          & $exe.FullName --probe-external open
          if ($LASTEXITCODE -ne 0) { throw 'Baseline external connect failed WITHOUT any guard - under-guard failure would be inconclusive (endpoint or runner network unreachable), not guard proof' }
          # Egress guard: this process may reach loopback ONLY. Allow rules take
          # precedence over block rules in Windows Firewall, so the loopback
          # exception survives the block-all for this one executable.
          netsh advfirewall firewall add rule name="scrobblix-wiredump-block-out" dir=out action=block program="$($exe.FullName)" remoteip=any | Out-Host
          netsh advfirewall firewall add rule name="scrobblix-wiredump-allow-loop" dir=out action=allow program="$($exe.FullName)" remoteip=127.0.0.1 | Out-Host
          try {
            # Guard evidence: the ACTUAL installed rules with their real
            # action/program/address filters (not the requested names).
            '=== installed firewall rules (actual state) ==='
            Get-NetFirewallRule | Where-Object { $_.DisplayName -like 'scrobblix-wiredump-*' } | ForEach-Object {
              $app = $_ | Get-NetFirewallApplicationFilter
              $addr = $_ | Get-NetFirewallAddressFilter
              [pscustomobject]@{
                DisplayName = $_.DisplayName
                Enabled = $_.Enabled
                Direction = $_.Direction
                Action = $_.Action
                Program = $app.Program
                RemoteAddress = ($addr.RemoteAddress -join ',')
              } | Format-List | Out-Host
            }
            # Guard causality, phase 2 - UNDER GUARD: loopback must connect,
            # external egress must fail with the real socket error detail.
            '=== guard phase 2: under guard (expect loopback OK, external FAIL) ==='
            & $exe.FullName --guard-probe
            if ($LASTEXITCODE -ne 0) { throw 'Guard probe failed: external egress not blocked or loopback broken' }
            & $exe.FullName wire-dump-windows.txt
            if ($LASTEXITCODE -ne 0) { throw 'Wire dump failed' }
          } finally {
            netsh advfirewall firewall delete rule name="scrobblix-wiredump-block-out" | Out-Null
            netsh advfirewall firewall delete rule name="scrobblix-wiredump-allow-loop" | Out-Null
          }
          # Guard causality, phase 3 - POST-REMOVAL control: external must
          # succeed again, proving the under-guard failure was the rules.
          '=== guard phase 3: post-removal control (expect external SUCCESS) ==='
          & $exe.FullName --probe-external open
          if ($LASTEXITCODE -ne 0) { throw 'Post-removal external control failed - the under-guard failure cannot be attributed to the rules' }
          if (-not (Test-Path wire-dump-windows.txt)) { throw 'Dump file missing' }
      - name: STAGE A - hash artifacts and resolve dependency manifests
        shell: pwsh
        run: |
          function Write-TreeManifest($root, $outFile) {
            $resolved = (Resolve-Path $root).Path
            $files = Get-ChildItem -Recurse $root -File
            # Only an explicit zero-byte .gitkeep sentinel is excluded (artifact
            # upload omits zero-byte files); any other zero-byte file FAILS.
            $sentinel = $files | Where-Object { $_.Length -eq 0 }
            foreach ($z in $sentinel) {
              if ($z.Name -ne '.gitkeep') { throw "unexpected zero-byte file under ${root}: $($z.FullName)" }
              "excluded explicit zero-byte .gitkeep sentinel: " + [IO.Path]::GetRelativePath($resolved, $z.FullName)
            }
            $lines = $files | Where-Object { $_.Length -gt 0 } | ForEach-Object {
              (Get-FileHash $_.FullName -Algorithm SHA256).Hash + '  ' + [IO.Path]::GetRelativePath($resolved, $_.FullName)
            }
            $dupes = $lines | ForEach-Object { ($_ -split '\s+', 2)[1] } | Group-Object | Where-Object { $_.Count -gt 1 }
            if ($dupes) { throw "duplicate manifest paths: $($dupes.Name -join ', ')" }
            $lines | Out-File $outFile -Encoding ascii
            Get-Content $outFile
          }
          $out = 'src/Scrobblix.Desktop/bin/Debug'
          $exe = Get-ChildItem -Recurse $out -Filter *.exe | Select-Object -First 1
          "resolved executable: " + $exe.FullName + ' (built, hashed, never run in stage A)'
          Write-TreeManifest $out 'windows-deps-manifest-sha256.txt'
          Write-TreeManifest 'tests/Scrobblix.WireDump/bin/Debug' 'windows-wiredump-manifest-sha256.txt'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: error
          retention-days: 1
          name: ingest-prep-windows-debug-DISPOSABLE
          path: |
            src/Scrobblix.Desktop/bin/Debug/**
            tests/Scrobblix.WireDump/bin/Debug/**
            windows-deps-manifest-sha256.txt
            windows-wiredump-manifest-sha256.txt
            wire-dump-windows.txt
  stage-b-preflight:
    # Shared NO-EFFECT gate: validates BOTH qualified archives end to end
    # before either platform send job may start. Nothing here sends, installs
    # or initializes anything.
    if: ${{ inputs.send_remote }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      android_apk_rel: ${{ steps.verify.outputs.android_apk_rel }}
      android_testapk_rel: ${{ steps.verify.outputs.android_testapk_rel }}
      wiredump_exe_rel: ${{ steps.verify.outputs.wiredump_exe_rel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate qualified run provenance (pinned run, head, workflow, no-send job set)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUALIFIED_RUN_ID: ${{ inputs.qualified_run_id }}
          EXPECTED_SOURCE_HEAD: ${{ inputs.expected_source_head }}
          EXPECTED_ANDROID_ARTIFACT_ID: ${{ inputs.expected_android_artifact_id }}
          EXPECTED_WINDOWS_ARTIFACT_ID: ${{ inputs.expected_windows_artifact_id }}
          EXPECTED_EXECUTION_HEAD: ${{ inputs.expected_execution_head }}
        run: |
          set -euo pipefail
          re='^[0-9]+$'
          for v in "$QUALIFIED_RUN_ID" "$EXPECTED_ANDROID_ARTIFACT_ID" "$EXPECTED_WINDOWS_ARTIFACT_ID"; do
            [[ "$v" =~ $re ]] || { echo 'run and artifact ids must be numeric'; exit 1; }
          done
          test -n "$EXPECTED_SOURCE_HEAD" || { echo 'expected_source_head required'; exit 1; }
          test -n "$EXPECTED_EXECUTION_HEAD" || { echo 'expected_execution_head required'; exit 1; }
          # This send dispatch itself must run at the reviewed execution head.
          [ "${{ github.sha }}" = "$EXPECTED_EXECUTION_HEAD" ] || { echo "EXECUTION HEAD MISMATCH: ${{ github.sha }} != pinned $EXPECTED_EXECUTION_HEAD"; exit 1; }
          echo "execution head verified: ${{ github.sha }}"
          api="https://api.github.com/repos/${{ github.repository }}"
          run=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" "$api/actions/runs/$QUALIFIED_RUN_ID")
          printf '%s' "$run" | jq -e --arg head "$EXPECTED_SOURCE_HEAD" \
            '.conclusion=="success" and .event=="workflow_dispatch" and .path==".github/workflows/ingest-synthetic-prep.yml" and .head_sha==$head' >/dev/null \
            || { echo 'PROVENANCE FAIL: run is not the pinned successful stage-A dispatch of this workflow at the reviewed head'; exit 1; }
          # No-send attestation: both stage-A jobs must have SUCCEEDED, and
          # every send/preflight job must be skipped or absent - an effect job
          # may never have run in the qualified run. GitHub may return skipped
          # jobs, so skipped and absent are both accepted, success is not.
          jobs=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" "$api/actions/runs/$QUALIFIED_RUN_ID/jobs?per_page=100")
          printf '%s' "$jobs" | jq -e '
            ([.jobs[].name] | all(. as $n | ["android-debug-apk","windows-debug-build","stage-b-preflight","android-send","windows-send"] | index($n) != null))
            and ([.jobs[] | select(.name=="android-debug-apk" or .name=="windows-debug-build") | .conclusion] | sort == ["success","success"])
            and ([.jobs[] | select(.name=="stage-b-preflight" or .name=="android-send" or .name=="windows-send") | .conclusion] | all(. == "skipped"))' >/dev/null \
            || { echo 'PROVENANCE FAIL: qualified run job set is not exactly the two successful no-send stage-A jobs with no effect job run'; exit 1; }
          for pair in "$EXPECTED_ANDROID_ARTIFACT_ID ingest-prep-android-debug-DISPOSABLE" "$EXPECTED_WINDOWS_ARTIFACT_ID ingest-prep-windows-debug-DISPOSABLE"; do
            set -- $pair
            art=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" "$api/actions/artifacts/$1")
            printf '%s' "$art" | jq -e --argjson runid "$QUALIFIED_RUN_ID" --arg name "$2" \
              '.expired==false and .name==$name and .workflow_run.id==$runid' >/dev/null \
              || { echo "PROVENANCE FAIL: pinned artifact $1 does not belong to the qualified run"; exit 1; }
          done
          echo 'provenance verified: pinned run/head/workflow-path/dispatch/success, no-send job set, both pinned artifact ids'
      - name: Download both pinned archives and verify pinned digests
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_ANDROID_ARTIFACT_ID: ${{ inputs.expected_android_artifact_id }}
          EXPECTED_WINDOWS_ARTIFACT_ID: ${{ inputs.expected_windows_artifact_id }}
          EXPECTED_ANDROID_ZIP_SHA256: ${{ inputs.expected_android_zip_sha256 }}
          EXPECTED_WINDOWS_ZIP_SHA256: ${{ inputs.expected_windows_zip_sha256 }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_ANDROID_ZIP_SHA256" -a -n "$EXPECTED_WINDOWS_ZIP_SHA256" || { echo 'pinned archive digests required'; exit 1; }
          api="https://api.github.com/repos/${{ github.repository }}"
          curl -sfL -H "Authorization: Bearer $GH_TOKEN" "$api/actions/artifacts/$EXPECTED_ANDROID_ARTIFACT_ID/zip" -o qualified-android.zip
          curl -sfL -H "Authorization: Bearer $GH_TOKEN" "$api/actions/artifacts/$EXPECTED_WINDOWS_ARTIFACT_ID/zip" -o qualified-windows.zip
          ahash=$(sha256sum qualified-android.zip | cut -d' ' -f1)
          whash=$(sha256sum qualified-windows.zip | cut -d' ' -f1)
          [ "$ahash" = "$EXPECTED_ANDROID_ZIP_SHA256" ] || { echo "ARCHIVE DIGEST MISMATCH (android): $ahash"; exit 1; }
          [ "$whash" = "$EXPECTED_WINDOWS_ZIP_SHA256" ] || { echo "ARCHIVE DIGEST MISMATCH (windows): $whash"; exit 1; }
          echo "archive digests verified: android=$ahash windows=$whash"
          mkdir -p qualified-android qualified-windows
          unzip -o qualified-android.zip -d qualified-android >/dev/null
          unzip -o qualified-windows.zip -d qualified-windows >/dev/null
      - name: Verify both archives path-bound (committed verifier scripts)
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tests/artifact-verify/*.sh
          tests/artifact-verify/verify-android-archive.sh qualified-android | tee android-verify.log
          tests/artifact-verify/verify-windows-archive.sh qualified-windows | tee windows-verify.log
          {
            sed -n 's/^ANDROID_APK_REL=/android_apk_rel=/p' android-verify.log
            sed -n 's/^ANDROID_TESTAPK_REL=/android_testapk_rel=/p' android-verify.log
            sed -n 's/^WIREDUMP_EXE_REL=/wiredump_exe_rel=/p' windows-verify.log
          } >> "$GITHUB_OUTPUT"
  android-send:
    # Runs only after the shared preflight has verified BOTH archives.
    if: ${{ inputs.send_remote }}
    needs: stage-b-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Re-download pinned android archive and re-verify pinned digest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_ANDROID_ARTIFACT_ID: ${{ inputs.expected_android_artifact_id }}
          EXPECTED_ANDROID_ZIP_SHA256: ${{ inputs.expected_android_zip_sha256 }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${{ github.repository }}"
          curl -sfL -H "Authorization: Bearer $GH_TOKEN" "$api/actions/artifacts/$EXPECTED_ANDROID_ARTIFACT_ID/zip" -o qualified-android.zip
          ahash=$(sha256sum qualified-android.zip | cut -d' ' -f1)
          [ "$ahash" = "$EXPECTED_ANDROID_ZIP_SHA256" ] || { echo "ARCHIVE DIGEST MISMATCH (android): $ahash"; exit 1; }
          # Digest equality binds these bytes to the preflight-verified set.
          mkdir -p qualified-android && unzip -o qualified-android.zip -d qualified-android >/dev/null
          apk_rel='${{ needs.stage-b-preflight.outputs.android_apk_rel }}'
          testapk_rel='${{ needs.stage-b-preflight.outputs.android_testapk_rel }}'
          test -f "qualified-android/$apk_rel" -a -f "qualified-android/$testapk_rel" || { echo 'verified apk paths missing'; exit 1; }
          cd qualified-android
          # Re-hash both APKs against their exact manifest lines.
          for rel in "$apk_rel" "$testapk_rel"; do
            expected=$(awk -v r="$rel" '{ h=$1; $1=""; sub(/^ +/, ""); if ($0==r) print h }' android-artifact-sha256.txt)
            test -n "$expected" || { echo "manifest line missing for $rel"; exit 1; }
            actual=$(sha256sum "$rel" | cut -d' ' -f1)
            [ "$actual" = "$expected" ] || { echo "apk hash mismatch: $rel"; exit 1; }
            echo "apk hash verified: $rel"
          done
      - name: STAGE B - emulator, gated single remote send from the verified bytes
        shell: bash
        env:
          EXPECTED_DSN_SHA256: ${{ inputs.expected_dsn_sha256 }}
          EXPECTED_ENDPOINT_HOST: ${{ inputs.expected_endpoint_host }}
          EXPECTED_PROJECT_ID: ${{ inputs.expected_project_id }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_DSN_SHA256" -a -n "$EXPECTED_ENDPOINT_HOST" -a -n "$EXPECTED_PROJECT_ID" || { echo 'pinned endpoint expectations required'; exit 1; }
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          export ANDROID_USER_HOME="$RUNNER_TEMP/scrobblix-android"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          sdkmanager 'emulator' 'system-images;android-36;default;x86_64' >/dev/null
          echo no | avdmanager create avd -n scrobblix-dump -k 'system-images;android-36;default;x86_64' --path "$ANDROID_AVD_HOME/scrobblix-dump.avd" --force
          emulator -avd scrobblix-dump -no-window -no-audio -no-snapshot -gpu swiftshader_indirect -no-boot-anim > /tmp/scrobblix-dump-emulator.log 2>&1 &
          emulator_pid=$!
          cleanup_emulator() { kill "$emulator_pid" 2>/dev/null || true; }
          trap cleanup_emulator EXIT
          timeout 180 adb wait-for-device
          booted=false
          for attempt in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then booted=true; break; fi
            sleep 2
          done
          if [ "$booted" != true ]; then tail -80 /tmp/scrobblix-dump-emulator.log; exit 1; fi
          # No iptables block here: the ONE synthetic event must reach the
          # baked endpoint. The transport budget boots DISARMED (cap 0) on
          # this branch; the test asserts the pinned endpoint, proves a
          # pre-arming capture cannot send, then arms exactly one send keyed
          # to that capture.
          apk="qualified-android/${{ needs.stage-b-preflight.outputs.android_apk_rel }}"
          testapk="qualified-android/${{ needs.stage-b-preflight.outputs.android_testapk_rel }}"
          adb install -r "$apk" >/dev/null
          adb install -r "$testapk" >/dev/null
          result=$(adb shell am instrument -w -r \
            -e expected_dsn_sha "$EXPECTED_DSN_SHA256" \
            -e expected_host "$EXPECTED_ENDPOINT_HOST" \
            -e expected_project "$EXPECTED_PROJECT_ID" \
            -e class "dev.scrobblix.app.RemoteSendTest" \
            com.frpboy.scrobblix.test/androidx.test.runner.AndroidJUnitRunner)
          printf '%s\n' "$result"
          printf '%s\n' "$result" | grep -F 'OK (1 test)'
          adb shell run-as com.frpboy.scrobblix cat files/scrobblix-remotesend-android.txt | tee scrobblix-remotesend-android.txt
          test -s scrobblix-remotesend-android.txt
  windows-send:
    # Runs only after the shared preflight has verified BOTH archives.
    if: ${{ inputs.send_remote }}
    needs: stage-b-preflight
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Re-download pinned windows archive and re-verify pinned digest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_WINDOWS_ARTIFACT_ID: ${{ inputs.expected_windows_artifact_id }}
          EXPECTED_WINDOWS_ZIP_SHA256: ${{ inputs.expected_windows_zip_sha256 }}
          WIREDUMP_EXE_REL: ${{ needs.stage-b-preflight.outputs.wiredump_exe_rel }}
        run: |
          $api = "https://api.github.com/repos/${{ github.repository }}"
          Invoke-WebRequest -Headers @{ Authorization = "Bearer $env:GH_TOKEN" } "$api/actions/artifacts/$env:EXPECTED_WINDOWS_ARTIFACT_ID/zip" -OutFile qualified-windows.zip
          $zhash = (Get-FileHash qualified-windows.zip -Algorithm SHA256).Hash.ToLower()
          if ($zhash -ne $env:EXPECTED_WINDOWS_ZIP_SHA256.ToLower()) { throw "ARCHIVE DIGEST MISMATCH (windows): $zhash" }
          # Digest equality binds these bytes to the preflight-verified set.
          Expand-Archive qualified-windows.zip -DestinationPath qualified-windows -Force
          $exe = Join-Path 'qualified-windows' ($env:WIREDUMP_EXE_REL -replace '/', [IO.Path]::DirectorySeparatorChar)
          if (-not (Test-Path $exe)) { throw "verified WireDump exe path missing: $env:WIREDUMP_EXE_REL" }
          # Re-hash the exe against its manifest line (defense in depth).
          $line = Get-Content qualified-windows/windows-wiredump-manifest-sha256.txt | Where-Object { $_ -match 'Scrobblix\.WireDump\.exe$' } | Select-Object -First 1
          $expectedHash = ($line -split '\s+', 2)[0]
          $actual = (Get-FileHash $exe -Algorithm SHA256).Hash
          if ($actual -ne $expectedHash) { throw 'WireDump exe hash mismatch against manifest' }
          "QUALIFIED_WIREDUMP_EXE=$((Get-Item $exe).FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: STAGE B - GATED single remote send from the verified qualified bytes
        shell: pwsh
        env:
          EXPECTED_DSN_SHA256: ${{ inputs.expected_dsn_sha256 }}
          EXPECTED_ENDPOINT_HOST: ${{ inputs.expected_endpoint_host }}
          EXPECTED_PROJECT_ID: ${{ inputs.expected_project_id }}
        run: |
          if (-not $env:EXPECTED_DSN_SHA256 -or -not $env:EXPECTED_ENDPOINT_HOST -or -not $env:EXPECTED_PROJECT_ID) { throw 'pinned endpoint expectations required' }
          # Exactly ONE real synthetic event to the baked DSN's endpoint via
          # the production boundary, from the EXACT verified path. The exe
          # asserts the baked endpoint against the pinned expectations BEFORE
          # any init/capture, with the transport capped at one attempt.
          # No retry: a failure here is a finding.
          & $env:QUALIFIED_WIREDUMP_EXE --send-remote $env:EXPECTED_DSN_SHA256 $env:EXPECTED_ENDPOINT_HOST $env:EXPECTED_PROJECT_ID
          if ($LASTEXITCODE -ne 0) { throw "Remote send did not complete (exit $LASTEXITCODE) - finding, no retry" }
    # Stage B tees its FINAL wire event lines to the send job logs (plus the
    # pulled android readback file); it uploads nothing - the 1-day artifacts
    # are the stage-A custody objects.
