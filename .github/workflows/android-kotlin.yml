name: Android Kotlin validation
on:
  pull_request:
    branches: [main]
    paths: ['android/**', 'tests/fixtures/**', '.github/workflows/android-kotlin.yml']
  push:
    branches: [main]
    paths: ['android/**', 'tests/fixtures/**', '.github/workflows/android-kotlin.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-kotlin-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  kotlin-platform:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test shared behavior and compile platform and installable preview app
        shell: bash
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          android/gradlew -p android :core:test :platform:assembleDebug :app:assembleDebug :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-unsigned-release-candidate
          path: android/app/build/outputs/apk/release/*.apk
  android-sqlite-runtime:
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Android API${{ matrix.api }} emulator and actual SQLite instrumentation
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          export ANDROID_USER_HOME="$RUNNER_TEMP/scrobblix-android"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          sdkmanager 'emulator' 'system-images;android-${{ matrix.api }};default;x86_64'
          echo no | avdmanager create avd -n scrobblix-test -k 'system-images;android-${{ matrix.api }};default;x86_64' --path "$ANDROID_AVD_HOME/scrobblix-test.avd" --force
          test -f "$ANDROID_AVD_HOME/scrobblix-test.ini"
          emulator -list-avds | grep -Fx scrobblix-test
          emulator -avd scrobblix-test -no-window -no-audio -no-snapshot -gpu swiftshader_indirect -no-boot-anim > /tmp/scrobblix-emulator.log 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" || true' EXIT
          if ! timeout 180 adb wait-for-device; then
            cat /tmp/scrobblix-emulator.log
            exit 1
          fi
          booted=false
          for attempt in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then booted=true; break; fi
            sleep 2
          done
          if [ "$booted" != true ]; then tail -80 /tmp/scrobblix-emulator.log; exit 1; fi
          if ! android/gradlew -p android :platform:connectedDebugAndroidTest :app:connectedDebugAndroidTest --no-daemon; then
            # Synthetic test data only. Preserve exact test/runner failures in job logs.
            find android/platform/build/outputs/androidTest-results android/app/build/outputs/androidTest-results -type f -name '*.xml' -print -exec cat {} \;
            adb logcat -d -b crash
            exit 1
          fi
          mkdir -p android-evidence
          for name in listen history queue settings large-font-listen large-font-settings landscape-listen private-config-settings; do adb pull "/sdcard/Download/scrobblix-$name.png" android-evidence/; done

      - name: Preserve app pixels and test-only APK
        if: always()
        shell: bash
        run: |
          mkdir -p android-evidence
          for name in listen history queue settings large-font-listen large-font-settings landscape-listen private-config-settings; do adb pull "/sdcard/Download/scrobblix-$name.png" android-evidence/; done || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-preview-evidence-api${{ matrix.api }}
          path: |
            android-evidence
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/androidTest-results
