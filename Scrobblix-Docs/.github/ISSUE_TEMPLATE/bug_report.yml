name: Bug report
description: Report a reproducible Scrobblix defect
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: "Do not include Last.fm session keys, API secrets, or unredacted listening history."
  - type: input
    id: version
    attributes: { label: Scrobblix version }
    validations: { required: true }
  - type: input
    id: environment
    attributes: { label: Windows, browser/player, and source version }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Reproduction steps }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected behavior }
    validations: { required: true }
  - type: textarea
    id: actual
    attributes: { label: Actual behavior and reason code }
    validations: { required: true }
  - type: textarea
    id: diagnostics
    attributes: { label: Sanitized diagnostic bundle/correlation details }
