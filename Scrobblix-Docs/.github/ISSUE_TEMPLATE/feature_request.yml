name: Feature request
description: Propose a user problem and solution
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes: { label: User problem, description: "Describe the concrete workflow or failure." }
    validations: { required: true }
  - type: textarea
    id: outcome
    attributes: { label: Desired outcome }
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes: { label: Existing workarounds or alternatives }
  - type: textarea
    id: impact
    attributes: { label: Privacy, permissions, storage, compatibility, or maintenance impact }
