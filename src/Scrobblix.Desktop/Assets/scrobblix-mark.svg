<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Scrobblix</title>
  <desc id="desc">A neon audio waveform inside a rounded square.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131a31"/>
      <stop offset="1" stop-color="#28164c"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5de1ff"/>
      <stop offset="0.55" stop-color="#7f8cff"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bg)"/>
  <rect x="15" y="15" width="98" height="98" rx="24" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/>
  <g fill="url(#wave)">
    <rect x="22" y="54" width="8" height="20" rx="4"/>
    <rect x="36" y="39" width="8" height="50" rx="4"/>
    <rect x="50" y="25" width="8" height="78" rx="4"/>
    <rect x="64" y="45" width="8" height="38" rx="4"/>
    <rect x="78" y="33" width="8" height="62" rx="4"/>
    <rect x="92" y="51" width="8" height="26" rx="4"/>
  </g>
  <circle cx="64" cy="64" r="14" fill="#0d1327" fill-opacity=".78"/>
  <circle cx="64" cy="64" r="5" fill="#e879f9"/>
</svg>
